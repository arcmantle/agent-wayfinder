name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          check-latest: true
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -tags sqlite_fts5 ./cmd/agent-wayfinder
